apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
 name: notes-hpa
 namespace: notes-app-ns
spec:
 scaleTargetRef:
   apiVersion: apps/v1
   kind: Deployment
   name: notes-app-deploy
 minReplicas: 1
 maxReplicas: 4
 metrics:
 - type: Resource
   resource:
     name: cpu
     target:
       type: Utilization
       averageUtilization: 5
 behavior:
   scaleDown:
     stabilizationWindowSeconds: 60
