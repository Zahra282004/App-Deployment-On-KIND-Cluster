kind: Deployment
apiVersion: apps/v1
metadata:
 name: nginx-deploy
 namespace: notes-app-ns
 labels:
   app: nginx
spec:
 replicas: 1
 selector:
   matchLabels:
     app: nginx
 template:
   metadata:
     labels:
       app: nginx
   spec:
     containers:
     - name: nginx-pod
       image: nginx:latest
       ports:
       - containerPort: 80
